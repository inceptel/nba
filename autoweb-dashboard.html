<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #1a1a24;
  --border: #2a2a3a;
  --text: #e2e8f0;
  --muted: #64748b;
  --feather: #818cf8;
  --trading: #34d399;
  --nba: #fb923c;
  --dashboard: #a78bfa;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
  padding: 24px;
}
header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}
h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.subtitle { color: var(--muted); font-size: 12px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 12px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.total-keeps { color: var(--text); font-size: 14px; font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 480px)); gap: 14px; margin-bottom: 28px; }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  border-left: 3px solid var(--border);
}
.card[data-instance="feather"]   { border-left-color: var(--feather); }
.card[data-instance="trading"]   { border-left-color: var(--trading); }
.card[data-instance="nba"]       { border-left-color: var(--nba); }
.card[data-instance="dashboard"] { border-left-color: var(--dashboard); }

.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-name { font-size: 14px; font-weight: 700; color: #fff; }
.status-pill {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.status-pill.running { background: #14532d; color: #4ade80; }
.status-pill.stopped { background: #3b1515; color: #f87171; }
.status-pill.flawless { background: #1e1b4b; color: #818cf8; }

.stats { display: flex; gap: 14px; margin-bottom: 12px; }
.stat { flex: 1; }
.stat-val { font-size: 22px; font-weight: 700; color: #fff; line-height: 1; }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-val.keeps   { color: #4ade80; }
.stat-val.reverts { color: #f87171; }
.stat-val.crashes { color: #fbbf24; }

.keep-rate {
  font-size: 11px; margin-bottom: 6px; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
.run-rate { font-size: 10px; color: var(--muted); font-weight: 400; margin-left: auto; }
.keep-rate-bar { height: 3px; background: var(--bg3); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
.keep-rate-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.sparkline-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sparkline { display: flex; gap: 3px; align-items: center; }
.spark-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.spark-dot.keep   { background: #4ade80; }
.spark-dot.revert { background: #f87171; }
.spark-dot.crash  { background: #fbbf24; }
.spark-dot.empty  { background: var(--bg3); }
.streak-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
.streak-val { color: #4ade80; font-weight: 700; }
.iter-badge { font-size: 10px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border); padding: 1px 6px; border-radius: 99px; margin-left: 6px; }
.last-keep {
  font-size: 11px; color: var(--muted); line-height: 1.5;
  border-top: 1px solid var(--border); padding-top: 10px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.last-keep .ts { color: #475569; margin-right: 4px; }
.card-link { font-size: 10px; color: var(--muted); text-decoration: none; display: block; margin-top: 8px; }
.card-link:hover { color: var(--text); }

.section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.activity { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.activity-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px 8px 11px; border-bottom: 1px solid var(--border); font-size: 12px; border-left: 3px solid var(--border); }
.activity-row[data-instance="feather"]   { border-left-color: var(--feather); }
.activity-row[data-instance="trading"]   { border-left-color: var(--trading); }
.activity-row[data-instance="nba"]       { border-left-color: var(--nba); }
.activity-row[data-instance="dashboard"] { border-left-color: var(--dashboard); }
.activity-row:last-child { border-bottom: none; }
.activity-row:hover { background: var(--bg3); }
.act-time { color: var(--muted); font-size: 11px; white-space: nowrap; min-width: 62px; }
.act-inst { font-size: 11px; font-weight: 600; min-width: 72px; }
.act-inst.feather   { color: var(--feather); }
.act-inst.trading   { color: var(--trading); }
.act-inst.nba       { color: var(--nba); }
.act-inst.dashboard { color: var(--dashboard); }
.act-desc { color: #cbd5e1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-status { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.act-status.keep   { background: #14532d; color: #4ade80; }
.act-status.revert { background: #3b1515; color: #f87171; }
.act-status.crash  { background: #451a03; color: #fbbf24; }

.updated { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>autoweb</h1>
  <span class="subtitle">autonomous improvement loops</span>
  <div class="header-right">
    <span><span class="pulse"></span>&nbsp;live</span>
    <span><span id="total-keeps" class="total-keeps">—</span> keeps · <span id="global-rate" class="total-keeps">—</span></span>
    <span id="updated" class="updated"></span>
  </div>
</header>

<div id="cards" class="cards"></div>

<div class="section-title">recent activity</div>
<div id="activity" class="activity"></div>

<script>
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
}

function relTime(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function calcStreak(instName, recent, totalKeeps) {
  const entries = (recent || []).filter(r => r.instance === instName);
  let n = 0;
  for (const e of entries) {
    if ((e.status || 'keep') === 'keep') n++;
    else break;
  }
  if (n === entries.length && totalKeeps > entries.length) return n + '+';
  return String(n);
}

function avgIterTime(instName, recent) {
  const entries = (recent || []).filter(r => r.instance === instName);
  if (entries.length < 2) return null;
  let totalDiff = 0, count = 0;
  for (let i = 0; i < entries.length - 1; i++) {
    const diff = new Date(entries[i].time) - new Date(entries[i + 1].time);
    if (diff > 0) { totalDiff += diff; count++; }
  }
  if (count === 0) return null;
  const avgSec = Math.round(totalDiff / count / 1000);
  if (avgSec < 60) return avgSec + 's/iter';
  return Math.round(avgSec / 60) + 'm/iter';
}

function nextRunLabel(instName, recent) {
  const entries = (recent || []).filter(r => r.instance === instName);
  if (entries.length < 2 || !entries[0] || !entries[0].time) return null;
  let totalDiff = 0, count = 0;
  for (let i = 0; i < entries.length - 1; i++) {
    const diff = new Date(entries[i].time) - new Date(entries[i + 1].time);
    if (diff > 0) { totalDiff += diff; count++; }
  }
  if (count === 0) return null;
  const avgMs = totalDiff / count;
  const nextTime = new Date(new Date(entries[0].time).getTime() + avgMs);
  const remSec = Math.round((nextTime - Date.now()) / 1000);
  if (remSec <= 0) return 'next ~now';
  if (remSec < 60) return `next ~${remSec}s`;
  return `next ~${Math.round(remSec / 60)}m`;
}

function renderCard(inst, recent) {
  return `
    <div class="card" data-instance="${inst.name}">
      <div class="card-header">
        <span class="card-name">${inst.name}<span class="iter-badge">${inst.keeps + inst.reverts + inst.crashes} iters</span></span>
        ${inst.reverts === 0 && inst.crashes === 0 && inst.keeps > 0 ? '<span class="status-pill flawless">flawless</span>' : ''}
        <span class="status-pill ${inst.running ? 'running' : 'stopped'}">${inst.running ? 'running' : 'stopped'}</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-val keeps">${inst.keeps}</div><div class="stat-label">keeps</div></div>
        <div class="stat"><div class="stat-val ${inst.reverts > 0 ? 'reverts' : ''}" style="${inst.reverts === 0 ? 'color:var(--muted)' : ''}">${inst.reverts}</div><div class="stat-label">reverts</div></div>
        <div class="stat"><div class="stat-val ${inst.crashes > 0 ? 'crashes' : ''}" style="${inst.crashes === 0 ? 'color:var(--muted)' : ''}">${inst.crashes}</div><div class="stat-label">crashes</div></div>
      </div>
      ${(function() {
          const total = inst.keeps + inst.reverts;
          const iter = avgIterTime(inst.name, recent);
          const nextLbl = inst.running ? nextRunLabel(inst.name, recent) : null;
          const rateStr = iter ? `<span class="run-rate">~${iter}${nextLbl ? ` · ${nextLbl}` : ''}</span>` : '';
          if (total === 0) return `<div class="keep-rate"><span style="color:#475569">no data</span>${rateStr}</div><div class="keep-rate-bar"><div class="keep-rate-fill" style="width:0%"></div></div>`;
          const pct = Math.round(inst.keeps / total * 100);
          const color = pct >= 90 ? '#4ade80' : pct >= 70 ? '#fbbf24' : '#f87171';
          return `<div class="keep-rate"><span style="color:${color}">${pct}% kept</span><span style="color:#475569"> (${total} total)</span>${rateStr}</div><div class="keep-rate-bar"><div class="keep-rate-fill" style="width:${pct}%;background:${color}"></div></div>`;
        })()}
      ${(function() {
          const instEntries = (recent || []).filter(r => r.instance === inst.name).slice(0, 10);
          const dots = [];
          for (let i = 0; i < 10; i++) {
            const e = instEntries[9 - i];
            if (!e) dots.push('<span class="spark-dot empty" title="no data"></span>');
            else {
              const s = e.status || 'keep';
              dots.push(`<span class="spark-dot ${s}" title="${s}: ${e.desc ? e.desc.slice(0, 60) : ''}"></span>`);
            }
          }
          const s = calcStreak(inst.name, recent, inst.keeps);
          return `<div class="sparkline-row"><div class="sparkline">${dots.join('')}</div><span class="streak-label">streak: <span class="streak-val">${s}</span></span></div>`;
        })()}
      <div class="last-keep" title="${inst.last_keep || ''}">
        ${inst.last_time ? `<span class="ts" data-time="${inst.last_time}">${relTime(inst.last_time)}</span>` : ''}
        ${inst.last_keep || '<em style="color:#475569">no keeps yet</em>'}
      </div>
      ${inst.url ? `<a class="card-link" href="${inst.url}" target="_blank">↗ ${inst.url.replace(/^https?:\/\//, '').replace(/\/$/, '')}</a>` : ''}
    </div>`;
}

function renderActivity(recent) {
  if (!recent || !recent.length)
    return '<div class="activity-row"><span class="act-desc" style="color:#475569">no activity yet</span></div>';
  return recent.map(r => `
    <div class="activity-row" data-instance="${r.instance}">
      <span class="act-time" data-time="${r.time}">${relTime(r.time)}</span>
      <span class="act-inst ${r.instance}">${r.instance}</span>
      <span class="act-status ${r.status || 'keep'}">${r.status || 'keep'}</span>
      <span class="act-desc" title="${r.desc}">${r.desc}</span>
    </div>`).join('');
}

async function load() {
  try {
    const r = await fetch('stats.json?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const totalKeeps = data.instances.reduce((s, i) => s + i.keeps, 0);
    const totalRuns = data.instances.reduce((s, i) => s + i.keeps + i.reverts + i.crashes, 0);
    document.getElementById('total-keeps').textContent = totalKeeps.toLocaleString();
    const globalRateEl = document.getElementById('global-rate');
    if (totalRuns > 0) {
      const pct = Math.round(totalKeeps / totalRuns * 100);
      const color = pct >= 90 ? '#4ade80' : pct >= 70 ? '#fbbf24' : '#f87171';
      globalRateEl.textContent = pct + '%';
      globalRateEl.style.color = color;
    } else {
      globalRateEl.textContent = '—';
    }
    const updEl = document.getElementById('updated');
    updEl.textContent = 'updated ' + relTime(data.updated);
    updEl.dataset.time = data.updated;
    document.getElementById('cards').innerHTML = data.instances.map(i => renderCard(i, data.recent)).join('');
    document.getElementById('activity').innerHTML = renderActivity(data.recent);
  } catch (e) {
    document.getElementById('cards').innerHTML =
      `<div style="grid-column:1/-1;color:#f87171;padding:32px;text-align:center">failed to load stats.json: ${e.message}</div>`;
  }
}

load();
setInterval(load, 30000);

// Refresh relative timestamps every 15s without a network call
setInterval(() => {
  document.querySelectorAll('[data-time]').forEach(el => {
    const t = el.dataset.time;
    if (el.id === 'updated') {
      el.textContent = 'updated ' + relTime(t);
    } else {
      el.textContent = relTime(t);
    }
  });
}, 15000);
</script>
</body>
</html>
