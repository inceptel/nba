<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Scores</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #252535;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --accent: #4f8ef7;
    --green: #3ddc84;
    --red: #ff4d4d;
    --gold: #f5c842;
  }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; min-height: 100vh; }

  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: var(--text); }
  .date-nav { display: flex; align-items: center; gap: 6px; }
  .nav-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 13px; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; font-family: inherit; transition: border-color 0.2s, color 0.2s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .today-btn { width: auto; padding: 0 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; }
  .date { color: var(--muted); font-size: 12px; }
  .refresh-info { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .games { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }

  .game { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; display: block; color: inherit; }
  .game:hover { border-color: #333348; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .game.live { border-color: #2a4a2a; }
  .game.live .game-status { color: var(--green); }
  .close-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 5px; border-radius: 3px; color: var(--gold); border: 1px solid var(--gold); animation: pulse 1.5s infinite; }
  .game.final .game-status { color: var(--muted); }
  .game.scheduled .game-status { color: var(--accent); }

  .game-header { padding: 8px 12px; background: var(--surface2); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .game-status { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .broadcast { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 5px; border-radius: 3px; color: #fff; }

  .teams { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .team-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .team-row.winner .team-name { color: var(--text); font-weight: 700; }
  .team-row.loser .team-name { color: var(--muted); }
  .team-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
  .team-logo-placeholder { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); font-weight: 700; }
  .team-info { flex: 1; min-width: 0; }
  .team-name { font-size: 13px; font-weight: 500; }
  .team-record { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .team-score { font-size: 22px; font-weight: 700; min-width: 40px; text-align: right; }
  .team-row.winner .team-score { color: var(--text); }
  .team-row.loser .team-score { color: var(--muted); }
  .no-score { font-size: 13px; color: var(--muted); min-width: 40px; text-align: right; }
  .game-vs { display: flex; align-items: center; justify-content: center; padding: 2px 12px; color: var(--muted); font-size: 10px; letter-spacing: 0.08em; gap: 8px; }
  .game-vs::before, .game-vs::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .home-badge { font-size: 9px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; margin-left: 5px; vertical-align: middle; letter-spacing: 0.05em; }

  .game-footer { padding: 8px 12px; border-top: 1px solid var(--border); }
  .leaders { display: flex; gap: 8px; flex-wrap: wrap; }
  .leader { background: var(--surface2); border-radius: 4px; padding: 4px 7px; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .leader span { color: var(--text); font-weight: 600; }
  .venue { font-size: 10px; color: var(--muted); margin-top: 5px; }

  .line-scores { display: flex; gap: 2px; margin-bottom: 6px; overflow-x: auto; }
  .qtr { text-align: center; min-width: 28px; }
  .qtr-label { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
  .qtr-score { font-size: 11px; }
  .qtr-score.current { color: var(--gold); }

  .section-label { padding: 10px 14px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-count { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 6px; font-size: 9px; font-weight: 600; color: var(--muted); }
  .section-label.live-label { color: var(--green); }
  .section-label.live-label .section-count { color: var(--green); border-color: var(--green); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty h2 { font-size: 14px; margin-bottom: 8px; }

  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { background: #1a0a0a; border: 1px solid #3a1a1a; border-radius: 8px; padding: 16px; margin: 12px; color: #ff6b6b; font-size: 12px; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 12px; background: var(--bg); }
  .tab { padding: 8px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; text-transform: uppercase; transition: color 0.15s, border-color 0.15s; font-family: inherit; background: none; border-top: none; border-left: none; border-right: none; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  .standings { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .standings-conf { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: visible; }
  .standings-conf-header { padding: 8px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; border-radius: 8px 8px 0 0; }
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table th { padding: 5px 8px; font-size: 10px; color: var(--muted); font-weight: 600; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  .standings-table th:hover { color: var(--text); }
  .standings-table th.sorted { color: var(--accent); }
  .standings-table th:first-child { text-align: left; padding-left: 12px; }
  .standings-table td { padding: 5px 8px; font-size: 11px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .standings-table td:first-child { text-align: left; padding-left: 12px; }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table tr:hover td { background: var(--surface2); }
  .standings-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .standings-table th:first-child { position: sticky; left: 0; background: var(--surface2); z-index: 2; }
  .standings-table td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .standings-table tr:hover td:first-child { background: var(--surface2); }
  .standings-rank { color: var(--muted); font-size: 10px; min-width: 14px; display: inline-block; }
  .standings-team-logo { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 5px; }
  .standings-team-name { vertical-align: middle; }
  .standings-gb { color: var(--muted); }
  .standings-l10 { color: var(--muted); }
  .standings-pct { color: var(--text); font-weight: 600; }
  .playoffs-line td { border-top: 2px solid var(--accent) !important; }
  .playin-line td { border-top: 1px dashed var(--muted) !important; }

  body.light {
    --bg: #f4f4f9;
    --surface: #ffffff;
    --surface2: #eaeaf2;
    --border: #d5d5e5;
    --text: #0a0a1e;
    --muted: #8888a0;
    --accent: #2266e0;
    --green: #1a8a4a;
    --red: #cc2222;
    --gold: #b08000;
  }

  @media (max-width: 480px) {
    .games { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
    .game-header { padding: 6px 10px; }
    .teams { padding: 8px 10px; gap: 2px; }
    .team-row { padding: 2px 0; }
    .team-score { font-size: 20px; min-width: 36px; }
    .team-logo { width: 24px; height: 24px; }
    .team-logo-placeholder { width: 24px; height: 24px; }
    .team-name { font-size: 12px; }
    .game-footer { padding: 6px 10px; }
    .leader { padding: 3px 5px; font-size: 9px; }
    .standings { padding: 8px; gap: 8px; }
    .standings-table td, .standings-table th { padding: 4px 5px; }
    .standings-table td:first-child, .standings-table th:first-child { padding-left: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>NBA</h1>
    <div class="date-nav" id="date-nav">
      <button class="nav-btn" id="prev-btn" title="Previous day">&#8249;</button>
      <span class="date" id="date-label"></span>
      <button class="nav-btn today-btn" id="today-btn" title="Go to today" style="display:none" onclick="goToToday()">TODAY</button>
      <button class="nav-btn" id="next-btn" title="Next day">&#8250;</button>
    </div>
  </div>
  <button class="nav-btn" id="theme-btn" title="Toggle light/dark mode" onclick="toggleTheme()" style="font-size:12px;width:26px;height:22px">☀</button>
  <div class="refresh-info">
    <span class="live-dot" id="live-dot" style="display:none"></span>
    <span id="refresh-label">loading...</span>
    <span id="countdown-label" style="display:none">· <span id="countdown-secs"></span>s</span>
    <button id="refresh-btn" onclick="manualRefresh()" title="Refresh now" style="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:0 2px;line-height:1;transition:color 0.2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">↺</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-scores" onclick="switchTab('scores')">Scores</button>
  <button class="tab" id="tab-standings" onclick="switchTab('standings')">Standings</button>
</div>

<div id="scores-panel">
  <div id="games-container">
    <div class="loading">
      <div class="spinner"></div><br>Loading scores...
    </div>
  </div>
</div>

<div id="standings-panel" style="display:none">
  <div id="standings-container">
    <div class="loading">
      <div class="spinner"></div><br>Loading standings...
    </div>
  </div>
</div>

<script>
const NETWORK_COLORS = {
  'ESPN': '#d00',
  'ESPN2': '#d00',
  'ESPNU': '#d00',
  'ABC': '#0075c2',
  'TNT': '#004bce',
  'NBA TV': '#552583',
  'MAX': '#002be0',
  'CBS': '#0032a0',
  'NBC': '#e5a020',
};

const TEAM_COLORS = {
  'ATL':['#C1062A','#FDB927'],'BOS':['#007A33','#BA9653'],'BKN':['#000000','#FFFFFF'],
  'CHA':['#1D1160','#00788C'],'CHI':['#CE1141','#000000'],'CLE':['#860038','#FDBB30'],
  'DAL':['#00538C','#B8C4CA'],'DEN':['#0E2240','#FEC524'],'DET':['#C8102E','#006BB6'],
  'GSW':['#1D428A','#FFC72C'],'HOU':['#CE1141','#000000'],'IND':['#002D62','#FDBB30'],
  'LAC':['#C8102E','#1D428A'],'LAL':['#552583','#FDB927'],'MEM':['#5D76A9','#12173F'],
  'MIA':['#98002E','#F9A01B'],'MIL':['#00471B','#EEE1C6'],'MIN':['#0C2340','#236192'],
  'NOP':['#0C2340','#C8102E'],'NYK':['#006BB6','#F58426'],'OKC':['#007AC1','#EF3B24'],
  'ORL':['#0077C0','#C4CED4'],'PHI':['#006BB6','#ED174C'],'PHX':['#1D1160','#E56020'],
  'POR':['#E03A3E','#000000'],'SAC':['#5A2D81','#63727A'],'SAS':['#C4CED4','#000000'],
  'TOR':['#CE1141','#000000'],'UTA':['#002B5C','#00471B'],'WAS':['#002B5C','#E31837'],
};

let refreshTimer, countdownTimer, secondsLeft = 30;
let hasLiveGames = false;
let dateOffset = 0; // 0=today, -1=yesterday, +1=tomorrow

function pad(n) { return String(n).padStart(2, '0'); }

function formatTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit', timeZoneName: 'short'});
}

function dateStrForOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}

function labelForOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const ds = d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  if (offset === 0) return `Today · ${ds}`;
  if (offset === -1) return `Yesterday · ${ds}`;
  if (offset === 1) return `Tomorrow · ${ds}`;
  return ds;
}

function teamInitials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,3).toUpperCase();
}

function getRecord(competitor, preferType) {
  const records = competitor.records || [];
  const found = records.find(r => r.name === preferType || r.type === preferType);
  return found ? found.summary : (records[0]?.summary || '');
}

function renderLeaders(competitors) {
  const leaders = [];
  for (const team of competitors) {
    const stats = team.leaders || [];
    let teamCount = 0;
    for (const cat of stats) {
      const l = cat.leaders?.[0];
      if (!l) continue;
      const name = l.athlete?.shortName || l.athlete?.displayName || '';
      const val = l.value;
      const label = cat.abbreviation || cat.name;
      const displayVal = l.displayValue ?? Math.round(val);
      // Skip verbose compound stat lines (e.g. "19.3 PPG, 4.8 RPG, 7.1 APG")
      const displayStr = String(displayVal);
      if (name && displayVal !== undefined && !displayStr.includes(',') && displayStr.length <= 12) {
        const headshot = l.athlete?.headshot;
        const headshotHtml = headshot ? `<img src="${headshot}" style="width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:3px;flex-shrink:0" onerror="this.style.display='none'">` : '';
        leaders.push(`<div class="leader" style="display:flex;align-items:center;gap:0">${headshotHtml}${name} <span style="margin-left:4px">${displayVal} ${label}</span></div>`);
        teamCount++;
      }
      if (teamCount >= 2) break; // max 2 per team so both teams are represented
    }
  }
  return leaders.length ? `<div class="leaders">${leaders.join('')}</div>` : '';
}

function getLiveProgress(period, displayClock) {
  if (!period || !displayClock) return null;
  const parts = displayClock.split(':');
  if (parts.length !== 2) return null;
  const mins = parseInt(parts[0]);
  const secs = parseInt(parts[1]);
  if (isNaN(mins) || isNaN(secs)) return null;
  const QUARTER_MINS = 12;
  const timeLeftInPeriod = mins + secs / 60;
  const completedPeriods = Math.min(period - 1, 4);
  const elapsed = completedPeriods * QUARTER_MINS + (QUARTER_MINS - timeLeftInPeriod);
  return Math.min(100, Math.max(0, (elapsed / (4 * QUARTER_MINS)) * 100));
}

function renderLineScores(competitor, isLive) {
  const linescores = competitor.linescores || [];
  if (!linescores.length) return '';
  const lastIdx = linescores.length - 1;
  return linescores.map((ls, i) => {
    const label = i < 4 ? `Q${i+1}` : i === 4 ? 'OT' : `${i-3}OT`;
    const isCurrent = isLive && i === lastIdx;
    return `<div class="qtr"><div class="qtr-label">${label}</div><div class="qtr-score${isCurrent ? ' current' : ''}">${ls.value ?? '-'}</div></div>`;
  }).join('');
}

function renderGame(event) {
  const comp = event.competitions?.[0];
  if (!comp) return '';
  const status = event.status;
  const stateType = status.type?.state; // pre, in, post
  const statusDesc = status.type?.shortDetail || status.type?.description || '';
  const displayClock = status.displayClock;
  const period = status.period;

  const isLive = stateType === 'in';
  const isFinal = stateType === 'post';
  const isScheduled = stateType === 'pre';

  const [away, home] = comp.competitors[0]?.homeAway === 'home'
    ? [comp.competitors[1], comp.competitors[0]]
    : [comp.competitors[0], comp.competitors[1]];

  const awayScore = parseInt(away.score) || 0;
  const homeScore = parseInt(home.score) || 0;
  const awayWin = isFinal && awayScore > homeScore;
  const homeWin = isFinal && homeScore > awayScore;
  const awayLeading = isLive && awayScore > homeScore;
  const homeLeading = isLive && homeScore > awayScore;
  const liveScoreDiff = isLive && awayScore !== homeScore ? Math.abs(awayScore - homeScore) : 0;

  const isCloseGame = isLive && Math.abs(awayScore - homeScore) <= 5;

  const awayAbbr = away.team.abbreviation;
  const homeAbbr = home.team.abbreviation;
  const awayColor = TEAM_COLORS[awayAbbr]?.[0] || '#666';
  const homeColor = TEAM_COLORS[homeAbbr]?.[0] || '#666';

  const awayLogoUrl = away.team.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/nba/500/${awayAbbr.toLowerCase()}.png`;
  const homeLogoUrl = home.team.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/nba/500/${homeAbbr.toLowerCase()}.png`;

  let statusText = statusDesc;
  if (isScheduled) {
    // Show local time (not ET) so all users see game time in their timezone
    statusText = formatTime(comp.date || event.date);
    // Add countdown for games within the next 24h
    const gameTime = new Date(comp.date || event.date);
    const diffMs = gameTime - Date.now();
    if (diffMs > 0 && diffMs < 24 * 60 * 60 * 1000) {
      const diffMins = Math.round(diffMs / 60000);
      if (diffMins >= 60) {
        const h = Math.floor(diffMins / 60);
        const m = diffMins % 60;
        statusText += ` · in ${h}h${m > 0 ? ` ${m}m` : ''}`;
      } else if (diffMins > 0) {
        statusText += ` · in ${diffMins}m`;
      }
    }
  }
  if (isLive && displayClock && period) {
    const periodLabel = period <= 4 ? `Q${period}` : period === 5 ? 'OT' : `${period - 4}OT`;
    statusText = `${periodLabel} ${displayClock}`;
  }
  if (isFinal && (awayScore || homeScore)) {
    const margin = Math.abs(awayScore - homeScore);
    const winnerAbbr = awayScore > homeScore ? awayAbbr : homeAbbr;
    statusText = `${statusDesc} · ${winnerAbbr} +${margin}`;
  }

  const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';
  const startTime = isScheduled ? formatTime(comp.date || event.date) : '';
  const venue = comp.venue?.fullName || '';
  const venueCity = comp.venue?.address?.city || '';

  const scoreOrTime = (team, isWinner, isLoser) => {
    if (isScheduled) return `<div class="no-score">${startTime}</div>`;
    return `<div class="team-score">${team.score ?? '-'}</div>`;
  };

  // Line scores for live/final
  let linescoresHtml = '';
  if ((isLive || isFinal) && (away.linescores?.length || home.linescores?.length)) {
    const awayLines = renderLineScores(away, isLive);
    const homeLines = renderLineScores(home, isLive);
    if (awayLines || homeLines) {
      const awayTotal = away.score ?? '';
      const homeTotal = home.score ?? '';
      const totalCol = (score) => score !== '' ? `<div class="qtr" style="margin-left:4px;padding-left:6px;border-left:1px solid var(--border)"><div class="qtr-label">T</div><div class="qtr-score">${score}</div></div>` : '';
      linescoresHtml = `
        <div style="padding: 6px 12px; border-bottom: 1px solid var(--border); display:flex; flex-direction:column; gap:4px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:28px;font-size:10px;color:var(--muted)">${awayAbbr}</span>
            <div class="line-scores">${awayLines}</div>
            ${totalCol(awayTotal)}
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:28px;font-size:10px;color:var(--muted)">${homeAbbr}</span>
            <div class="line-scores">${homeLines}</div>
            ${totalCol(homeTotal)}
          </div>
        </div>`;
    }
  }

  const leadersHtml = renderLeaders(comp.competitors);

  const accentColor = isFinal ? (homeWin ? homeColor : awayColor) : homeColor;

  const progressPct = isLive ? getLiveProgress(period, displayClock) : null;
  const progressBarHtml = progressPct !== null
    ? `<div style="height:2px;background:var(--border)"><div style="height:100%;width:${progressPct.toFixed(1)}%;background:var(--green)"></div></div>`
    : '';

  const gameUrl = `https://www.espn.com/nba/game/_/gameId/${event.id}`;
  return `
<a class="game ${isLive ? 'live' : isFinal ? 'final' : 'scheduled'}" style="border-left: 3px solid ${accentColor}99" href="${gameUrl}" target="_blank" rel="noopener">
  <div class="game-header">
    <span class="game-status">${statusText}</span>
    <div style="display:flex;gap:4px;align-items:center">${isCloseGame ? '<span class="close-badge">CLOSE</span>' : ''}${broadcast ? (() => { const c = NETWORK_COLORS[broadcast] || '#555'; return `<span class="broadcast" style="background:${c}">${broadcast}</span>`; })() : ''}</div>
  </div>
  ${progressBarHtml}
  <div class="teams">
    <div class="team-row ${awayWin || awayLeading ? 'winner' : (isFinal || homeLeading) ? 'loser' : ''}">
      <img class="team-logo" src="${awayLogoUrl}" alt="${awayAbbr}" onerror="this.outerHTML='<div class=\\'team-logo-placeholder\\' style=\\'background:${awayColor}20;color:${awayColor}\\'>${awayAbbr}</div>'">
      <div class="team-info">
        <div class="team-name">${away.team.displayName}</div>
        <div class="team-record">${getRecord(away, 'road')}${away.records?.find(r=>r.name==='road'||r.type==='road') ? '<span style="color:var(--muted);font-size:9px;margin-left:3px">ROAD</span>' : ''}</div>
      </div>
      ${isScheduled ? '' : `<div class="team-score">${away.score ?? '-'}${(isLive && homeLeading && liveScoreDiff > 0) ? `<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:3px">-${liveScoreDiff}</span>` : ''}</div>`}
    </div>
    ${isScheduled ? '<div class="game-vs">vs</div>' : ''}
    <div class="team-row ${homeWin || homeLeading ? 'winner' : (isFinal || awayLeading) ? 'loser' : ''}">
      <img class="team-logo" src="${homeLogoUrl}" alt="${homeAbbr}" onerror="this.outerHTML='<div class=\\'team-logo-placeholder\\' style=\\'background:${homeColor}20;color:${homeColor}\\'>${homeAbbr}</div>'">
      <div class="team-info">
        <div class="team-name">${home.team.displayName}${isScheduled ? '<span class="home-badge">HOME</span>' : ''}</div>
        <div class="team-record">${getRecord(home, 'home')}${home.records?.find(r=>r.name==='home'||r.type==='home') ? '<span style="color:var(--muted);font-size:9px;margin-left:3px">HOME</span>' : ''}</div>
      </div>
      ${isScheduled ? '' : `<div class="team-score">${home.score ?? '-'}${(isLive && awayLeading && liveScoreDiff > 0) ? `<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:3px">-${liveScoreDiff}</span>` : ''}</div>`}
    </div>
  </div>
  ${linescoresHtml}
  ${leadersHtml || (isScheduled && venue) ? `<div class="game-footer">${leadersHtml}${isScheduled && venue ? `<div class="venue">&#x1F3DF; ${venue}${venueCity ? ` · ${venueCity}` : ''}</div>` : ''}</div>` : ''}
</a>`;
}

function updatePageTitle(events) {
  const liveGames = events.filter(e => e.status?.type?.state === 'in');
  if (!liveGames.length) {
    document.title = 'NBA Scores';
    return;
  }
  const summaries = liveGames.slice(0, 3).map(e => {
    const comp = e.competitions?.[0];
    if (!comp) return '';
    const [away, home] = comp.competitors[0]?.homeAway === 'home'
      ? [comp.competitors[1], comp.competitors[0]]
      : [comp.competitors[0], comp.competitors[1]];
    return `${away.team.abbreviation} ${away.score} ${home.team.abbreviation} ${home.score}`;
  }).filter(Boolean);
  document.title = `NBA · ${summaries.join(' · ')} · Live`;
}

async function fetchGames(dateStr) {
  const url = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard${dateStr ? `?dates=${dateStr}` : ''}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}

function yesterdayStr() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}

async function load(showSpinner = false) {
  const container = document.getElementById('games-container');
  const label = document.getElementById('refresh-label');
  const liveDot = document.getElementById('live-dot');
  const dateLabel = document.getElementById('date-label');
  const nextBtn = document.getElementById('next-btn');

  // Don't allow navigating into the future beyond tomorrow
  nextBtn.disabled = dateOffset >= 1;
  nextBtn.style.opacity = dateOffset >= 1 ? '0.3' : '';
  // Show "Today" button only when not on today
  const todayBtn = document.getElementById('today-btn');
  todayBtn.style.display = dateOffset !== 0 ? '' : 'none';

  if (showSpinner) {
    container.innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading scores...</div>';
    label.textContent = 'loading...';
  }

  try {
    let data = await fetchGames(dateStrForOffset(dateOffset));
    let events = data.events || [];

    // If today has no games and we're on today, auto-check yesterday
    if (!events.length && dateOffset === 0) {
      data = await fetchGames(dateStrForOffset(-1));
      events = data.events || [];
      if (events.length) dateOffset = -1;
    }

    // Date label
    dateLabel.textContent = labelForOffset(dateOffset);

    hasLiveGames = events.some(e => e.status?.type?.state === 'in');
    liveDot.style.display = hasLiveGames ? 'inline-block' : 'none';

    if (!events.length) {
      const dayLabel = dateOffset === 0 ? 'today' : dateOffset === -1 ? 'yesterday' : dateOffset === 1 ? 'tomorrow' : 'that day';
      container.innerHTML = `<div class="empty"><h2>No games ${dayLabel}</h2><p style="margin-top:8px;font-size:11px">Check back later</p></div>`;
      return;
    }

    // Group by state for section headers
    const liveEvts = events.filter(e => e.status?.type?.state === 'in');
    const finalEvts = events.filter(e => e.status?.type?.state === 'post');
    const preEvts = events.filter(e => e.status?.type?.state === 'pre');
    // Sort within groups: scheduled by tip-off time, others by date
    const byDate = (a, b) => new Date(a.date || 0) - new Date(b.date || 0);
    liveEvts.sort(byDate);
    finalEvts.sort(byDate);
    preEvts.sort(byDate);

    let html = '';
    const addGroup = (label, evts, cls) => {
      if (!evts.length) return;
      html += `<div class="section-label${cls ? ' ' + cls : ''}">${label}<span class="section-count">${evts.length}</span></div>`;
      html += `<div class="games">${evts.map(renderGame).join('')}</div>`;
    };
    addGroup('Live', liveEvts, 'live-label');
    addGroup('Final', finalEvts, '');
    addGroup('Upcoming', preEvts, '');

    container.innerHTML = html;
    label.textContent = `updated ${new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'})}`;
    updatePageTitle(events);

  } catch (e) {
    container.innerHTML = `<div class="error">Failed to load scores: ${e.message}<br><br><small>Will retry in 30s</small></div>`;
    label.textContent = 'error';
    console.error(e);
  }
}

function startCountdown() {
  clearInterval(countdownTimer);
  secondsLeft = hasLiveGames ? 20 : 60;
  const countdownLabel = document.getElementById('countdown-label');
  const countdownSecs = document.getElementById('countdown-secs');
  countdownLabel.style.display = '';
  countdownSecs.textContent = secondsLeft;
  countdownTimer = setInterval(() => {
    secondsLeft--;
    countdownSecs.textContent = secondsLeft;
    if (secondsLeft <= 0) {
      clearInterval(countdownTimer);
      countdownLabel.style.display = 'none';
      load().then(startCountdown);
    }
  }, 1000);
}

function goToToday() {
  dateOffset = 0;
  clearInterval(countdownTimer);
  load(true).then(startCountdown);
}

function manualRefresh() {
  clearInterval(countdownTimer);
  load(true).then(startCountdown);
}

document.getElementById('prev-btn').addEventListener('click', () => {
  dateOffset--;
  clearInterval(countdownTimer);
  load(true).then(startCountdown);
});

document.getElementById('next-btn').addEventListener('click', () => {
  if (dateOffset >= 1) return;
  dateOffset++;
  clearInterval(countdownTimer);
  load(true).then(startCountdown);
});

load().then(startCountdown);

function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('nba-theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? '☾' : '☀';
}

if (localStorage.getItem('nba-theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-btn').textContent = '☾';
}

let standingsLoaded = false;
let standingsLastFetched = null;

function recordSortVal(rec) {
  if (!rec || rec === '-') return -999;
  const m = String(rec).replace(/<[^>]+>/g, '').match(/^(\d+)-(\d+)$/);
  if (!m) return -999;
  return parseInt(m[1]);
}

function sortTable(th) {
  const table = th.closest('table');
  const tbody = table.querySelector('tbody');
  const idx = th.cellIndex;
  const currently = th.dataset.sortDir;
  const newDir = currently === 'desc' ? 'asc' : 'desc';
  // Clear all sort indicators
  table.querySelectorAll('th').forEach(h => { delete h.dataset.sortDir; h.classList.remove('sorted'); h.textContent = h.textContent.replace(/ [▼▲]$/, ''); });
  th.dataset.sortDir = newDir;
  th.classList.add('sorted');
  th.textContent = th.textContent + (newDir === 'desc' ? ' ▼' : ' ▲');
  const rows = Array.from(tbody.rows);
  rows.sort((a, b) => {
    const av = parseFloat(a.cells[idx]?.dataset.val ?? 0) || 0;
    const bv = parseFloat(b.cells[idx]?.dataset.val ?? 0) || 0;
    return newDir === 'desc' ? bv - av : av - bv;
  });
  // Playoff lines are positional — strip after sort, seed colors remain
  rows.forEach(r => { r.classList.remove('playoffs-line', 'playin-line'); tbody.appendChild(r); });
}

function refreshStandings() {
  standingsLoaded = false;
  loadStandings();
}

function switchTab(tab) {
  document.getElementById('tab-scores').classList.toggle('active', tab === 'scores');
  document.getElementById('tab-standings').classList.toggle('active', tab === 'standings');
  document.getElementById('scores-panel').style.display = tab === 'scores' ? '' : 'none';
  document.getElementById('standings-panel').style.display = tab === 'standings' ? '' : 'none';
  document.getElementById('date-nav').style.display = tab === 'scores' ? '' : 'none';
  if (tab === 'standings' && !standingsLoaded) {
    standingsLoaded = true;
    loadStandings();
  }
}

async function loadStandings() {
  const container = document.getElementById('standings-container');
  try {
    const r = await fetch('https://site.api.espn.com/apis/v2/sports/basketball/nba/standings');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const children = data.children || [];
    let html = '<div class="standings">';
    for (const conf of children) {
      const confName = conf.name || conf.abbreviation || '';
      const standings = conf.standings?.entries || [];
      if (!standings.length) continue;
      html += `<div class="standings-conf">
        <div class="standings-conf-header">${confName}</div>
        <div class="standings-scroll"><table class="standings-table">
          <thead><tr>
            <th onclick="sortTable(this)">Team</th><th onclick="sortTable(this)">W</th><th onclick="sortTable(this)">L</th><th onclick="sortTable(this)">PCT</th><th onclick="sortTable(this)">GB</th><th onclick="sortTable(this)">DIFF</th><th onclick="sortTable(this)">CONF</th><th onclick="sortTable(this)">HOME</th><th onclick="sortTable(this)">ROAD</th><th onclick="sortTable(this)">L10</th><th onclick="sortTable(this)">STRK</th>
          </tr></thead>
          <tbody>`;
      standings.forEach((entry, idx) => {
        const team = entry.team;
        const abbr = team?.abbreviation || '';
        const logoUrl = team?.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/nba/500/${abbr.toLowerCase()}.png`;
        const displayName = team?.shortDisplayName || team?.displayName || abbr;
        const stats = {}, statsDisplay = {};
        for (const s of (entry.stats || [])) {
          stats[s.name] = s.value ?? s.displayValue;
          statsDisplay[s.name] = s.displayValue ?? s.value;
        }
        const wins = stats['wins'] ?? stats['overall.wins'] ?? '-';
        const losses = stats['losses'] ?? stats['overall.losses'] ?? '-';
        const pct = stats['winPercent'] ?? stats['winpercent'] ?? '';
        const pctDisplay = pct !== '' && pct !== '-' ? parseFloat(pct).toFixed(3).replace(/^0/, '') : '-';
        const gb = stats['gamesBehind'] ?? stats['gamesback'] ?? '-';
        const gbDisplay = gb === 0 || gb === '0' ? '-' : gb;
        const streakRaw = stats['streak'];
        const streakVal = streakRaw !== undefined && streakRaw !== '' ? (streakRaw > 0 ? `W${Math.abs(streakRaw)}` : `L${Math.abs(streakRaw)}`) : '-';
        const streakColor = streakRaw > 0 ? 'var(--green)' : streakRaw < 0 ? 'var(--red)' : '';
        const streakDisplay = streakColor ? `<span style="color:${streakColor};font-weight:600">${streakVal}</span>` : streakVal;
        const l10Raw = statsDisplay['Last Ten Games'] ?? statsDisplay['lastTenGames'] ?? statsDisplay['l10'] ?? '-';
        const homeRecord = statsDisplay['Home'] ?? statsDisplay['homeRecord'] ?? statsDisplay['home'] ?? '-';
        const roadRecord = statsDisplay['Road'] ?? statsDisplay['roadRecord'] ?? statsDisplay['road'] ?? '-';
        const confRecord = statsDisplay['vsConference'] ?? statsDisplay['Conference'] ?? statsDisplay['conference'] ?? '-';
        const colorRecord = (rec) => {
          if (!rec || rec === '-') return rec;
          const m = rec.match(/^(\d+)-(\d+)$/);
          if (!m) return rec;
          const w = parseInt(m[1]), l = parseInt(m[2]);
          if (w > l) return `<span style="color:var(--green)">${rec}</span>`;
          if (l > w) return `<span style="color:var(--red)">${rec}</span>`;
          return rec;
        };
        const l10 = colorRecord(l10Raw);
        const diffRaw = stats['differential'] ?? stats['pointDifferential'] ?? stats['avgPointDifferential'] ?? (stats['pointsFor'] !== undefined ? (parseFloat(stats['pointsFor'] || 0) - parseFloat(stats['pointsAgainst'] || 0)) : undefined);
        const diffVal = diffRaw !== undefined && diffRaw !== '-' ? parseFloat(diffRaw) : null;
        const diffDisplay = diffVal !== null && !isNaN(diffVal) ? (diffVal > 0 ? `+${diffVal.toFixed(1)}` : diffVal.toFixed(1)) : '-';
        const diffColor = diffVal > 0 ? 'var(--green)' : diffVal < 0 ? 'var(--red)' : '';
        const diffHtml = diffColor ? `<span style="color:${diffColor}">${diffDisplay}</span>` : diffDisplay;
        const teamColor = TEAM_COLORS[abbr]?.[0] || '#555';
        const playoffLine = idx === 6 ? ' class="playoffs-line"' : idx === 10 ? ' class="playin-line"' : '';
        const seedColor = idx < 6 ? 'var(--gold)' : idx < 10 ? 'var(--accent)' : 'var(--muted)';
        const gbNum = (gb !== '-' && gb !== 0 && gb !== '0') ? parseFloat(gb) || 0 : 0;
        html += `<tr${playoffLine}>
          <td data-val="${idx+1}" style="border-left:3px solid ${teamColor}99"><span class="standings-rank" style="color:${seedColor}">${idx+1}</span> <img class="standings-team-logo" src="${logoUrl}" alt="${abbr}" onerror="this.style.display='none'"><span class="standings-team-name">${displayName}</span></td>
          <td data-val="${wins !== '-' ? wins : 0}">${wins}</td>
          <td data-val="${losses !== '-' ? losses : 0}">${losses}</td>
          <td data-val="${pct !== '' && pct !== '-' ? parseFloat(pct)*1000 : 0}" class="standings-pct">${pctDisplay}</td>
          <td data-val="${gbNum}" class="standings-gb">${gbDisplay}</td>
          <td data-val="${diffVal !== null && !isNaN(diffVal) ? diffVal : -999}">${diffHtml}</td>
          <td data-val="${recordSortVal(confRecord)}" class="standings-l10">${colorRecord(confRecord)}</td>
          <td data-val="${recordSortVal(homeRecord)}" class="standings-l10">${colorRecord(homeRecord)}</td>
          <td data-val="${recordSortVal(roadRecord)}" class="standings-l10">${colorRecord(roadRecord)}</td>
          <td data-val="${recordSortVal(l10Raw)}" class="standings-l10">${l10}</td>
          <td data-val="${streakRaw !== undefined ? streakRaw : 0}">${streakDisplay}</td>
        </tr>`;
      });
      html += '</tbody></table></div></div>';
    }
    html += '</div>';
    standingsLastFetched = new Date();
    const updatedBar = `<div style="padding:8px 14px 2px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px">
      <span>Updated ${standingsLastFetched.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
      <button onclick="refreshStandings()" style="background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;transition:border-color 0.2s,color 0.2s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">↺ Refresh</button>
    </div>`;
    container.innerHTML = updatedBar + html;
  } catch (e) {
    container.innerHTML = `<div class="error">Failed to load standings: ${e.message}</div>`;
  }
}
</script>
